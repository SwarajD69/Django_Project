<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- AOS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

    <!-- Custom Luxury CSS -->
    <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">

    <style>
        /* =================== */
        /*  GLOBAL BODY & BASE */
        /* =================== */
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #0f0f2c; /* deep navy */
            color: #f5f5f5;
            scroll-behavior: smooth;
            line-height: 1.7;
            padding-top: 70px; /* navbar offset */
        }

        a {
            color: #f0c775;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            color: #ffd966;
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.7);
        }

        /* =================== */
        /*  Navbar */
        /* =================== */
        .navbar {
            background: linear-gradient(90deg, #1a1a40, #0f0f2c);
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
        }
        .navbar .nav-link {
            color: #f5f5f5;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .navbar .nav-link:hover {
            color: #f0c775;
        }

        /* =================== */
        /*  Hero Section */
        /* =================== */
        .hero {
            background: linear-gradient(rgba(15,15,44,0.7), rgba(15,15,44,0.7)),
                        url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1470&q=80') no-repeat center center;
            background-size: cover;
            text-align: center;
            padding: 160px 20px;
            border-bottom: 2px solid #f0c775;
        }
        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
        }
        .hero p {
            font-size: 1.6rem;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.5);
        }
        .hero .btn {
            background: linear-gradient(45deg, #f0c775, #ffd966);
            color: #0f0f2c;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            box-shadow: 0 5px 15px rgba(240, 200, 117, 0.4);
            transition: all 0.4s ease;
        }
        .hero .btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 217, 102, 0.6);
        }

        /* =================== */
        /*  Global Shimmer Effects */
        /* =================== */
        h2, .shimmer {
            background: linear-gradient(90deg, #ffd966, #f0c775, #ffd966);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            color: transparent;
            animation: shimmerText 3s infinite;
            font-weight: 700;
            letter-spacing: 1px;
        }
        @keyframes shimmerText {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .section-divider {
            width: 80px;
            height: 4px;
            margin: 10px auto 30px;
            border-radius: 2px;
            background: linear-gradient(90deg, #f0c775, #ffd966);
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* =================== */
        /*  Cards */
        /* =================== */
        .card {
            background: linear-gradient(145deg, #1a1a40, #0f0f2c);
            border: none;
            border-radius: 15px;
            color: #f5f5f5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 217, 102, 0.5);
        }

        .project-card img {
            border-radius: 15px 15px 0 0;
            object-fit: cover;
            height: 230px;
        }

        .skill-card i {
            color: #f0c775;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        .skill-card i:hover {
            transform: scale(1.4);
            color: #ffd966;
            text-shadow: 0 0 10px rgba(255,217,102,0.6);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(45deg, #f0c775, #ffd966);
            color: #0f0f2c;
            border-radius: 50px;
            font-weight: 600;
            padding: 10px 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(240,200,117,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255,217,102,0.6);
        }

        /* =================== */
        /*  Footer */
        /* =================== */
        footer {
            background: #0f0f2c;
            color: #f5f5f5;
            padding: 50px 20px;
            border-top: 2px solid #f0c775;
            text-align: center;
        }
        footer a {
            color: #f0c775;
            margin: 0 15px;
            transition: all 0.3s;
        }
        footer a:hover {
            color: #ffd966;
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.6);
        }

        /* =================== */
        /*  Scroll-to-top Button */
        /* =================== */
        #scrollTopBtn {
            background: linear-gradient(45deg, #f0c775, #ffd966);
            color: #0f0f2c;
            transition: all 0.3s ease;
            border-radius: 50%;
            padding: 14px 18px;
            font-size: 20px;
            box-shadow: 0 6px 20px rgba(255,217,102,0.5);
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 100;
            display: none;
            cursor: pointer;
        }
        #scrollTopBtn:hover {
            transform: scale(1.15);
            box-shadow: 0 12px 35px rgba(255,217,102,0.7);
        }

        /* =================== */
        /*  AOS Transition Tweaks */
        /* =================== */
        [data-aos] {
            transition-property: transform, opacity;
            transition-duration: 1s;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#hero">My Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer>
        <p>&copy; {% now "Y" %} My Portfolio. All rights reserved.</p>
        <div>
            <a href="https://github.com/yourusername" target="_blank"><i class="fab fa-github fa-lg"></i></a>
            <a href="https://linkedin.com/in/yourusername" target="_blank"><i class="fab fa-linkedin fa-lg"></i></a>
            <a href="https://twitter.com/yourusername" target="_blank"><i class="fab fa-twitter fa-lg"></i></a>
        </div>
    </footer>

    <!-- Scroll-to-top Button -->
    <button id="scrollTopBtn" title="Go to top" data-aos="fade-up"><i class="fas fa-angle-up"></i></button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

    <script>
        // Initialize AOS
        AOS.init({ duration: 1000, once: true });

        // Scroll-to-top button
        const scrollBtn = document.getElementById("scrollTopBtn");
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                scrollBtn.style.display = "block";
            } else {
                scrollBtn.style.display = "none";
            }
        };
        scrollBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: 'smooth' }));

        // Smooth scrolling for navbar links
        document.querySelectorAll('a.nav-link').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if(target) target.scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>

</body>
</html>
